<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEPHIR — Réponse au devis</title><style>:root{font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#11294a}body{margin:0}header{background:#0a2448;color:white;padding:26px;text-align:center}main{max-width:660px;margin:35px auto;padding:25px;background:white;border:1px solid #dce4ef;border-radius:14px}button{border:0;border-radius:9px;padding:14px 20px;color:white;background:#16784d;font-weight:bold;cursor:pointer}.reject{background:#b02c3a}.actions{display:flex;gap:14px;flex-wrap:wrap}label{display:block;margin:18px 0 6px}input{width:100%;padding:12px;border:1px solid #c9d6e5;border-radius:7px;box-sizing:border-box}.muted{color:#65768b;font-size:13px}#msg{margin-top:15px}button:disabled{opacity:.5}</style></head><body><header><h1>AXEPHIR</h1><p>Réponse à votre devis de développement</p></header><main><div id="info">Chargement du devis…</div><div id="response" hidden><label for="signer">Votre nom et prénom (signataire)</label><input id="signer" autocomplete="name" required maxlength="120"><p class="muted">En cliquant sur « Accepter », vous confirmez votre accord sur le devis et ses conditions. L'acompte de 40 % sera dû selon les modalités indiquées sur le devis. Le clic ne déclenche aucun prélèvement.</p><div class="actions"><button id="accept">Accepter le devis</button><button class="reject" id="reject">Refuser le devis</button></div></div><p id="msg" role="status"></p></main><script>
const API='https://europe-west1-axephir-developpeur.cloudfunctions.net/reponseDevis';const token=new URLSearchParams(location.search).get('token');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let loaded=false;
async function call(method,body){const u=API+'?token='+encodeURIComponent(token||'');const r=await fetch(u,{method,headers:method==='POST'?{'Content-Type':'application/json'}:{},body:method==='POST'?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Service indisponible');return j}
(async()=>{if(!token){$('info').textContent='Lien incomplet.';return}try{const q=await call('GET');loaded=true;$('info').innerHTML=`<h2>Devis ${esc(q.number)}</h2><p>Client : <strong>${esc(q.client)}</strong></p><p>Projet : ${esc(q.project)}</p><p>Total : <strong>${Number(q.total).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}</strong></p><p>Validité : ${esc(q.validUntil)}</p><p>Statut : <strong>${esc(q.status)}</strong></p>`;if(q.status==='Devis envoyé'){$('response').hidden=false;const action=new URLSearchParams(location.search).get('action');if(action==='reject')$('reject').focus();else if(action==='accept')$('accept').focus();}else $('msg').textContent='Une réponse a déjà été enregistrée pour ce devis.'}catch(e){$('info').textContent=e.message}})();
async function respond(choice){if(!loaded)return;const signer=$('signer').value.trim();if(!signer){$('msg').textContent='Indiquez le nom du signataire.';return}if(!confirm(choice==='accepted'?'Confirmer l’acceptation de ce devis ?':'Confirmer le refus de ce devis ?'))return;for(const id of ['accept','reject'])$(id).disabled=true;try{const r=await call('POST',{choice,signer});$('response').hidden=true;$('msg').textContent=r.message}catch(e){$('msg').textContent=e.message;for(const id of ['accept','reject'])$(id).disabled=false}}
$('accept').onclick=()=>respond('accepted');$('reject').onclick=()=>respond('rejected');</script></body></html>
