<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEPHIR — Test intégré</title><style>body{font:16px system-ui;background:#f3f6fa;color:#0a2448;margin:0}header{background:#0a2448;color:white;padding:24px;border-bottom:4px solid #ff612b}main{max-width:650px;margin:30px auto;background:white;padding:24px;border-radius:12px}button{background:#0a2448;color:white;padding:12px;border:0;border-radius:7px;margin:8px 0;cursor:pointer}button:disabled{opacity:.5}input:not([type=checkbox]){display:block;padding:10px;margin:8px 0;width:90%}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere} [hidden]{display:none!important}</style><header>AXEPHIR — Test Firebase / Brevo</header><main><p><b>TEST ADMINISTRATEUR — aucun contrat ni facture réelle.</b> CM2C en attente.</p><section id="login"><input id="email" type="email" placeholder="Email administrateur"><input id="password" type="password" placeholder="Mot de passe"><button id="signin">Connexion</button></section><section id="app" hidden><p>Contrat fictif : 1 000 €.</p><label><input type="checkbox" id="terms"> CGV de test acceptées</label><label><input type="checkbox" id="early"> Démarrage anticipé demandé</label><label id="lossRow" hidden><input type="checkbox" id="loss"> Reconnaissance de la perte du droit après exécution complète dans les conditions légales</label><button id="accept">Enregistrer le test</button><button id="withdraw" hidden>Confirmer la rétractation (test)</button><button id="read" hidden>Relire Firestore</button><button id="reset">Nouveau test</button><h2 id="status"></h2><pre id="result"></pre></section><p id="error" role="status"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import {getAuth,onAuthStateChanged,signInWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import {getFunctions,httpsCallable} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-functions.js';
const config={apiKey:'AIzaSyDDge3MOyroIzNYvVlN4FakG2Z5T0wZyEc',authDomain:'axephir-developpeur.firebaseapp.com',projectId:'axephir-developpeur',storageBucket:'axephir-developpeur.firebasestorage.app',messagingSenderId:'727919013664',appId:'1:727919013664:web:e22983e3a8e39b3ef1b145'};
const app=initializeApp(config),auth=getAuth(app),fn=getFunctions(app,'europe-west1'),$=id=>document.getElementById(id);let id=sessionStorage.getItem('axTestId')||'',busy=false;
function show(q){$('status').textContent=q.status;$('result').textContent=JSON.stringify(q,null,2);$('accept').hidden=true;$('withdraw').hidden=q.status!=='Accepté (test)';$('read').hidden=false;}
async function run(action){if(busy)return;busy=true;$('error').textContent='';for(const b of document.querySelectorAll('button'))b.disabled=true;try{if(action==='accept'&&!id){id='test_'+crypto.randomUUID().replaceAll('-','');sessionStorage.setItem('axTestId',id)}const r=await httpsCallable(fn,'testContratParticulier')({id,action,termsAccepted:$('terms').checked,early:$('early').checked,lossAcknowledged:$('loss').checked});show(r.data)}catch(e){$('error').textContent=e.message}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false}}
