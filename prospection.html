<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axephir — Prospection</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#10264a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#0a2448;color:white;padding:22px max(20px,calc((100vw - 1150px)/2))}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#c9d8ec}main{max-width:1150px;margin:24px auto;padding:0 16px}.notice{background:#fff5df;border-left:4px solid #e1a324;padding:13px 16px;border-radius:7px;line-height:1.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.button,button{border:0;border-radius:9px;background:#ff612b;color:white;font-weight:650;padding:11px 15px;cursor:pointer}.secondary{background:#e5edf8;color:#12365d}.danger{background:#fff0f0;color:#a11b26}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:20px 0}.card,.panel{background:white;border:1px solid #dce5f0;border-radius:12px;padding:17px}.card strong{display:block;font-size:27px}.card span{font-size:13px;color:#56677e}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}input,select,textarea{width:100%;border:1px solid #c5d3e3;border-radius:8px;padding:10px;font:inherit;color:#10264a;background:white}.filters input{max-width:350px}.filters select{max-width:220px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px 9px;border-bottom:1px solid #e5ebf3;text-align:left;font-size:14px}th{color:#53677d;font-size:12px}td small{display:block;color:#65758b}.followup-due{color:#a45b00;font-weight:700}.followup-late{color:#b21f2d;font-weight:700}.followup-done{color:#64758a}.status{border-radius:99px;background:#edf3fa;padding:5px 9px;display:inline-block;font-size:12px}.empty{padding:28px;text-align:center;color:#63748a}dialog{border:0;border-radius:14px;width:min(690px,calc(100vw - 24px));max-height:90vh;overflow:auto;padding:24px;box-shadow:0 15px 60px #0004}dialog::backdrop{background:#08172b99}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:13px;font-weight:650}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.muted{color:#64758a;font-size:13px}.rowbuttons{display:flex;gap:5px}.rowbuttons{flex-wrap:wrap}.rowbuttons button{padding:6px 9px;font-size:12px}#importFile{display:none}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.full{grid-column:auto}header{padding:20px}.filters input,.filters select{max-width:none}}.authbox{max-width:470px;margin:30px auto;background:white;border:1px solid #dce5f0;border-radius:12px;padding:25px}.authbox h2{margin-top:0}.authbox .field{margin:12px 0}.hidden{display:none!important}.accountbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 15px}.error{color:#b21f2d;font-size:13px;min-height:18px}.ok{color:#12613b}.loading{opacity:.65;pointer-events:none} .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}button:disabled{opacity:.5;cursor:not-allowed}#historyList{white-space:pre-wrap;overflow-wrap:anywhere}textarea{resize:vertical}.rowbuttons{display:grid;grid-template-columns:repeat(2,minmax(82px,1fr));gap:6px;min-width:180px}.rowbuttons button{white-space:nowrap;padding:7px 8px}.priority{margin-top:5px;font-weight:650}#messageDialog{max-width:480px}#messageDialog p{line-height:1.6}#messageCancel[hidden]{display:none}td{vertical-align:top}#historyList{margin-bottom:16px}#historyForm .field{margin-bottom:10px}</style></head><body><header><h1>AXEPHIR · Prospection</h1><p>Gestion commerciale et suivi des contacts</p></header><main><section id="login" class="authbox"><h2>Administration Axephir</h2><form id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" required></div><div class="field"><label>Mot de passe</label><input id="loginPassword" type="password" required></div><p id="loginError" class="error"></p><button>Se connecter</button></form></section><section id="workspace" class="hidden"><div class="accountbar"><span id="syncStatus" role="status">Synchronisation…</span><button id="logout" class="secondary">Se déconnecter</button></div><div class="toolbar"><button id="add">+ Nouveau prospect</button><button id="back" class="secondary">Demandes</button><button id="csv" class="secondary">Exporter CSV</button><button id="json" class="secondary">Sauvegarder JSON</button><button id="restore" class="secondary">Restaurer JSON</button><input type="file" id="file" accept=".json" hidden></div><div class="cards" id="cards"></div><section class="panel"><h2>Prospects</h2><div class="filters"><input id="search" placeholder="Entreprise, ville, email, besoin…"><select id="filter"><option value="">Tous les statuts</option><option>Identifié</option><option>Contacté</option><option>Réponse reçue</option><option>Rendez-vous programmé</option><option>Qualifié</option><option>Converti</option><option>Sans suite</option><option>Opposition</option></select><select id="due"><option value="">Toutes les relances</option><option value="due">À relancer (aujourd’hui ou retard)</option><option value="future">À venir</option></select></div><div class="tablewrap"><table><thead><tr><th>Entreprise</th><th>Besoin / solution</th><th>Budget</th><th>Statut</th><th>Relance</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><dialog id="editor"><form id="form"><h2>Fiche prospect</h2><div class="fields"><div class="field "><label for="name">Entreprise</label><input id="name" type="text" maxlength="500" required></div><div class="field "><label for="siret">SIRET</label><input id="siret" type="text" maxlength="500" ></div><div class="field "><label for="contact">Interlocuteur</label><input id="contact" type="text" maxlength="500" ></div><div class="field "><label for="email">Email</label><input id="email" type="email" maxlength="500" ></div><div class="field "><label for="phone">Téléphone</label><input id="phone" type="tel" maxlength="500" ></div><div class="field "><label for="city">Ville</label><input id="city" type="text" maxlength="500" ></div><div class="field "><label for="source">Origine</label><input id="source" type="text" maxlength="500" ></div><div class="field "><label for="url">Lien source</label><input id="url" type="url" maxlength="500" ></div><div class="field"><label for="published">Publication de l’annonce</label><input id="published" type="date"></div><div class="field"><label for="verified">Dernière vérification</label><input id="verified" type="date"></div><div class="field"><label for="priority">Priorité commerciale</label><select id="priority"><option>Normale</option><option>Haute</option><option>Basse</option></select></div><div class="field full"><label for="need">Besoin identifié</label><textarea id="need" rows="3" maxlength="12000"></textarea></div><div class="field full"><label for="solution">Solution proposée</label><textarea id="solution" rows="3" maxlength="12000"></textarea></div><div class="field "><label for="budget">Budget potentiel (€)</label><input id="budget" type="text" maxlength="500" ></div><div class="field "><label for="subject">Objet du mail</label><input id="subject" type="text" maxlength="500" ></div><div class="field full"><label for="body">Corps du mail</label><textarea id="body" rows="8" maxlength="12000"></textarea></div><div class="field "><label for="followup">Prochaine relance</label><input id="followup" type="date" maxlength="500" ></div><div class="field full"><label for="notes">Notes internes</label><textarea id="notes" rows="3" maxlength="12000"></textarea></div><div class="field"><label for="status">Statut</label><select id="status"><option>Identifié</option><option>Contacté</option><option>Réponse reçue</option><option>Rendez-vous programmé</option><option>Qualifié</option><option>Converti</option><option>Sans suite</option><option>Opposition</option></select></div></div><div class="actions"><button type="button" class="secondary" id="cancel">Annuler</button><button>Enregistrer</button></div></form></dialog><dialog id="history"><h2>Historique des contacts</h2><div id="historyList"></div><form id="historyForm"><div class="field"><label for="eventType">Action</label><select id="eventType"><option>Email envoyé</option><option>Relance envoyée</option><option>Appel</option><option>Réponse reçue</option><option>Rendez-vous</option><option>Opposition</option><option>Note</option></select></div><div class="field"><label for="eventDate">Date</label><input id="eventDate" type="date" required></div><div class="field"><label for="eventNote">Compte rendu</label><textarea id="eventNote" rows="3"></textarea></div><div class="field"><label for="eventFollowup">Prochaine relance</label><input id="eventFollowup" type="date"></div><div class="actions"><button type="button" class="secondary" id="closeHistory">Fermer</button><button>Ajouter</button></div></form></dialog><dialog id="messageDialog"><h2 id="messageTitle">Confirmation</h2><p id="messageText" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><form method="dialog" class="actions"><button class="secondary" id="messageCancel" value="cancel">Annuler</button><button value="ok">OK</button></form></dialog><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc,runTransaction,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: 'AIzaSyDDge3MOyroIzNYvVlN4FakG2Z5T0wZyEc',
  authDomain: 'axephir-developpeur.firebaseapp.com',
  projectId: 'axephir-developpeur',
  storageBucket: 'axephir-developpeur.firebasestorage.app',
  messagingSenderId: '727919013664',
  appId: '1:727919013664:web:e22983e3a8e39b3ef1b145'
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),col=collection(db,'prospects');
const ADMIN='dVwBCrsvwvRR1MjxRaIVEiNYZme2', $=id=>document.getElementById(id);
const fields=["name", "siret", "contact", "email", "phone", "city", "source", "url", "published", "verified", "priority", "need", "solution", "budget", "subject", "body", "followup", "notes"],statuses=["Identifié", "Contacté", "Réponse reçue", "Rendez-vous programmé", "Qualifié", "Converti", "Sans suite", "Opposition"];let items=[],editing=null,historyId=null,unsub=null,ready=false;
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris'}).format(new Date());
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.split('-').reverse().join('/'):v||'—';
const contacted=x=>['Contacté','Réponse reçue','Rendez-vous programmé','Qualifié','Converti'].includes(x.status)||(x.history||[]).some(h=>['Email envoyé','Relance envoyée','Appel','Réponse reçue','Rendez-vous'].includes(h.type));
const closed=x=>['Converti','Sans suite','Opposition'].includes(x.status)||!!x.demandeId;
const guard=()=>{if(auth.currentUser?.uid!==ADMIN||!ready)throw Error('Connexion administrateur ou synchronisation requise.')};
function message(text,confirming){return new Promise(resolve=>{const d=$('messageDialog');$('messageTitle').textContent=confirming?'Confirmation':'Information';$('messageText').textContent=text;$('messageCancel').hidden=!confirming;d.returnValue='cancel';d.addEventListener('close',()=>resolve(d.returnValue==='ok'),{once:true});d.showModal()})}
const ask=text=>message(text,true),inform=text=>message(text,false);
const act=fn=>async e=>{e?.preventDefault();const b=e?.submitter||e?.target?.closest('button');if(b)b.disabled=true;try{guard();await fn(e)}catch(err){await inform(err.message)}finally{if(b)b.disabled=false}};
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value,d=$('due').value;const list=items.filter(x=>(!f||x.status===f)&&[x.name,x.city,x.email,x.need,x.solution].some(v=>String(v||'').toLowerCase().includes(q))&&(!d||(!closed(x)&&x.followup&&(d==='due'?x.followup<=today():x.followup>today()))));$('cards').innerHTML=[['Prospects',items.length],['Contactés',items.filter(contacted).length],['À relancer',items.filter(x=>!closed(x)&&x.followup&&x.followup<=today()).length],['Convertis',items.filter(x=>x.demandeId).length]].map(([l,n])=>`<div class="card"><strong>${n}</strong><span>${l}</span></div>`).join('');$('rows').innerHTML=list.map(x=>`<tr><td><b>${esc(x.name)}</b><small>${esc(x.city)}</small><small>${esc(x.email)}</small><small class="priority">Priorité : ${esc(x.priority||"Normale")}</small></td><td>${esc(x.need)}<small>${esc(x.solution)}</small></td><td>${esc(x.budget)}</td><td><span class="status">${esc(x.status)}</span></td><td class="${!closed(x)&&x.followup&&x.followup<=today()?'followup-late':''}">${esc(fmt(x.followup))}</td><td><div class="rowbuttons"><button class="secondary" data-a="edit" data-id="${esc(x.id)}">Modifier</button><button class="secondary" data-a="history" data-id="${esc(x.id)}">Historique</button><button class="secondary" data-a="copy" data-id="${esc(x.id)}" ${closed(x)?'disabled':''}>Copier le mail</button><button class="secondary" data-a="convert" data-id="${esc(x.id)}" ${closed(x)?'disabled':''}>Convertir</button><button class="danger" data-a="delete" data-id="${esc(x.id)}" ${x.status==='Opposition'?'disabled':''}>Supprimer</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucun prospect.</td></tr>'}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('loginEmail').value,$('loginPassword').value)}catch(err){$('loginError').textContent=err.message}finally{$('loginPassword').value=''}};
$('logout').onclick=()=>signOut(auth);$('back').onclick=()=>location.href='axephir-suivi-demandes.html';
onAuthStateChanged(auth,u=>{unsub?.();ready=false;items=[];render();const ok=u?.uid===ADMIN;$('login').classList.toggle('hidden',ok);$('workspace').classList.toggle('hidden',!ok);if(!ok){if(u)signOut(auth);return}unsub=onSnapshot(col,s=>{items=s.docs.map(d=>({...d.data(),id:d.id}));ready=true;$('syncStatus').textContent=`Synchronisé · ${items.length} prospect(s)`;render()},e=>{ready=false;$('syncStatus').textContent=e.message})});
function edit(x={}){editing=x.id||null;fields.forEach(k=>$(k).value=x[k]||(k==='priority'?'Normale':''));$('status').value=x.status||'Identifié';$('status').disabled=!!x.demandeId||x.status==='Opposition';$('editor').showModal()}
$('add').onclick=act(()=>edit());$('cancel').onclick=()=>$('editor').close();
$('form').onsubmit=act(async()=>{const ref=editing?doc(col,editing):doc(col);const data=Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));if(!data.name)throw Error('Entreprise obligatoire');await runTransaction(db,async t=>{const s=await t.get(ref),old=s.data()||{};if(editing&&!s.exists())throw Error('Prospect supprimé');const status=old.demandeId?'Converti':old.status==='Opposition'?'Opposition':$('status').value;if(status==='Converti'&&!old.demandeId)throw Error('Utiliser le bouton Convertir');t.set(ref,{...data,status,followup:['Converti','Opposition','Sans suite'].includes(status)?'':data.followup,updatedAt:new Date().toISOString(),...(!s.exists()?{createdAt:new Date().toISOString(),history:[]}: {})},{merge:true})});$('editor').close()});
function showHistory(x){historyId=x.id;$('historyList').textContent=(x.history||[]).map(h=>`${fmt(h.date)} · ${h.type} — ${h.note||''}`).join('\n')||'Aucun contact enregistré.';$('eventDate').value=today();$('eventNote').value='';$('eventFollowup').value=x.followup||'';$('history').showModal()}
$('closeHistory').onclick=()=>$('history').close();$('historyForm').onsubmit=act(async()=>{const ref=doc(col,historyId),type=$('eventType').value,date=$('eventDate').value,note=$('eventNote').value;if(date>today())throw Error('Date future interdite pour une action réalisée');await runTransaction(db,async t=>{const s=await t.get(ref),x=s.data();if(!x)throw Error('Prospect absent');if(x.status==='Opposition'&&type!=='Note')throw Error('Opposition enregistrée');let status=x.status;if(type==='Opposition')status='Opposition';else if(!closed(x)){if(['Email envoyé','Relance envoyée','Appel'].includes(type)&&status==='Identifié')status='Contacté';if(type==='Réponse reçue')status='Réponse reçue';if(type==='Rendez-vous')status='Rendez-vous programmé'}t.update(ref,{history:[...(x.history||[]),{type,date,note}],status,followup:closed({...x,status})?'':$('eventFollowup').value})});$('history').close()});
$('rows').onclick=act(async e=>{const b=e.target.closest('[data-a]');if(!b)return;const x=items.find(v=>v.id===b.dataset.id);if(!x)return;const ref=doc(col,x.id);switch(b.dataset.a){case 'edit':edit(x);break;case 'history':showHistory(x);break;case 'copy':if(closed(x)||!x.email||!x.body)throw Error('Vérifier le statut, le destinataire et le contenu du mail.');await navigator.clipboard.writeText(x.body);await inform('Corps copié. Objet : '+x.subject+' — Destinataire : '+x.email);break;case 'delete':if(x.status!=='Opposition'&&await ask('Supprimer ce prospect ? Si une demande liée existe encore, la suppression sera refusée.'))await runTransaction(db,async t=>{const s=await t.get(ref),v=s.data();if(!v)return;if(v.status==='Opposition')throw Error('Suppression interdite');if(v.demandeId){const linked=await t.get(doc(db,'demandes',v.demandeId));if(linked.exists())throw Error('Supprimez d’abord la demande associée.')}t.delete(ref)});break;case 'convert':if(!await ask('Créer une demande réelle et déclencher la notification interne Brevo ?'))return;await runTransaction(db,async t=>{const s=await t.get(ref),v=s.data();if(!v||closed(v))throw Error('Prospect déjà clôturé ou converti');const target=doc(collection(db,'demandes'));t.set(target,{date:today(),type:'Professionnel / entreprise',name:v.name,email:v.email||'',phone:v.phone||'',source:'Autre',project:'Logiciel métier',budget:v.budget||'',status:'Nouvelle demande',followup:'',delay:'',description:[v.need,v.solution].filter(Boolean).join('\n'),notes:'Origine : prospection '+(v.source||'')+'\n'+(v.notes||''),prospectId:x.id});t.update(ref,{status:'Converti',demandeId:target.id,followup:'',history:[...(v.history||[]),{type:'Conversion',date:today(),note:target.id}]})});await inform('Demande créée.');break}});
['search','filter','due'].forEach(k=>$(k).addEventListener(k==='search'?'input':'change',render));
function download(n,s,m){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:m}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('json').onclick=act(()=>download('axephir-prospects.json',JSON.stringify({version:1,items},null,2),'application/json'));
$('csv').onclick=act(()=>{const keys=[...fields,'status','demandeId'];const cell=v=>'"'+String(v??'').replace(/^[\s]*[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('axephir-prospects.csv','\ufeff'+[keys.join(';'),...items.map(x=>keys.map(k=>cell(x[k])).join(';'))].join('\r\n'),'text/csv;charset=utf-8')});
$('restore').onclick=act(()=>$('file').click());$('file').onchange=act(async()=>{try{const data=JSON.parse(await $('file').files[0].text());if(data.version!==1||!Array.isArray(data.items)||data.items.length>400||!data.items.every(x=>x&&/^[A-Za-z0-9_-]{1,150}$/.test(x.id)&&typeof x.name==='string'&&statuses.includes(x.status)))throw Error('Sauvegarde invalide');if(!await ask('Restaurer uniquement les prospects absents ?'))return;for(const x of data.items){await runTransaction(db,async t=>{const r=doc(col,x.id),s=await t.get(r);if(!s.exists()){const {id,...v}=x;t.set(r,v)}})}}finally{$('file').value=''}});
render();</script></body></html>
